[package]
name = "re0drive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Persistent RE0 subscriptions and 115 share transfers"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hmac = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-rusqlite = "0.6"
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "=2.5.4"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

