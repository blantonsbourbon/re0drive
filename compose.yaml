services:
  re0drive:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64) from GitHub Actions.
    # Pin a version instead of latest if you prefer, e.g. :0.1.0 or :sha-<7 chars>.
    image: ${RE0DRIVE_IMAGE:-ghcr.io/blantonsbourbon/re0drive:latest}
    # Optional: build locally from source instead (`docker compose up -d --build`).
    # build: .
    restart: unless-stopped
    ports:
      - "${RE0DRIVE_HOST_BIND:-127.0.0.1}:8787:8787"
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      RE0_GATEWAY_URL: ${RE0_GATEWAY_URL:-https://re0.tgtodrive.top}
      RE0_GATEWAY_SECRET: ${RE0_GATEWAY_SECRET:-}
      RE0DRIVE_COOKIE_SECURE: ${RE0DRIVE_COOKIE_SECURE:-0}
    volumes:
      - re0drive-data:/data
    stop_grace_period: 3m
volumes:
  re0drive-data:
